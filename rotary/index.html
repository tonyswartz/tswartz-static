<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotary — Tony Swartz</title>
  <meta name="description" content="Rotary and Special Olympics">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page blog-page">
    <article class="blog-shell">
      <a class="back-link" href="/">← Tony Swartz</a>
      <h1>Rotary</h1>

      <div class="content">
        <p><a href="https://docs.google.com/presentation/d/e/2PACX-1vTMpyx69h912TN3HO8cVCV3_HJFtQp5KCOPN5bMoTw-zcJglS8fszNsz7yPH819EVBcB2KxGzL2xAEf/pub?start=true&amp;loop=true&amp;delayms=10000" target="_blank" rel="noopener noreferrer">Special Olympics Rotary Slideshow</a></p>
        <p><a href="/rotary/four-way-test" id="four-way-test">Four-Way Test</a></p>
      </div>
    </article>
  </main>
  <script>
    // Four-Way Test opens full screen right here; Esc or a click comes back.
    // Without the Fullscreen API (iPhone) the link opens the full-window page.
    (function () {
      var link = document.getElementById('four-way-test');
      var root = document.documentElement;
      var request = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!link || !request) return;

      var isFull = function () {
        return document.fullscreenElement || document.webkitFullscreenElement;
      };

      link.addEventListener('click', function (event) {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();

        var stage = document.createElement('div');
        stage.style.cssText = 'position:fixed;inset:0;z-index:10;background:#17458F;cursor:pointer';
        stage.innerHTML =
          '<picture style="display:contents">' +
          '<source media="(orientation: portrait)" srcset="/rotary/four-way-test-portrait.png">' +
          '<img src="/rotary/four-way-test.png" alt="The Four-Way Test" style="display:block;width:100%;height:100%;object-fit:contain">' +
          '</picture>';
        document.body.appendChild(stage);

        var close = function () {
          if (isFull()) return;
          document.removeEventListener('fullscreenchange', close);
          document.removeEventListener('webkitfullscreenchange', close);
          stage.remove();
        };
        document.addEventListener('fullscreenchange', close);
        document.addEventListener('webkitfullscreenchange', close);
        stage.addEventListener('click', function () {
          if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          else close();
        });

        var entered = request.call(stage);
        if (entered && entered.catch) entered.catch(function () { location.href = link.href; });
      });
    })();
  </script>
  <script src="/rotary/music.js"></script>
</body>
</html>
